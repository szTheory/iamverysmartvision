# SPDX-License-Identifier: MIT
name: gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cmake --version
      - run: sh tools/gate.sh
